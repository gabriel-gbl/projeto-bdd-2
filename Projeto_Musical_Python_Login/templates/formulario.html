{% extends 'base.html' %}{% block conteudo %}<section class="panel"><h1>{{ 'Editar' if objeto else 'Cadastrar' }} — {{ rotulos[nome] }}</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">{% for campo in classe.campos %}<label>{{ campos_rotulos.get(campo,campo) }}{% if campo in ['biografia','descricao'] %}<textarea name="{{ campo }}" rows="4">{{ (objeto|attr(campo)) if objeto and objeto|attr(campo) is not none else '' }}</textarea>{% else %}<input name="{{ campo }}" value="{{ (objeto|attr(campo)) if objeto and objeto|attr(campo) is not none else '' }}" {% if campo in ['idCantor','idAlbum','idGenero','anoLancamento'] %}type="number" min="1"{% elif campo in ['dataNascimento','dataLancamento'] %}type="date"{% else %}type="text"{% endif %} {% if campo not in ['instagram','foto','gravadora','descricao'] %}required{% endif %}>{% endif %}</label>{% endfor %}<button>Salvar</button><a class="btn secondary" href="{{ url_for('listar',nome=nome) }}">Cancelar</a></form><p class="muted">Nos campos de relacionamento, informe o ID existente no catálogo.</p></section>{% endblock %}
